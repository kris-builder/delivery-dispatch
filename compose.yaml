services:
  mysql:
    image: mysql:8.4.13
    command: ["--default-time-zone=+08:00"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-delivery_local}
      MYSQL_USER: ${MYSQL_USER:-delivery_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3308}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1" >/dev/null
      interval: 5s
      timeout: 4s
      retries: 15
      start_period: 20s

volumes:
  mysql-data:
