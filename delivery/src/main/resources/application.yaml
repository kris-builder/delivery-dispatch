spring:
  application:
    name: delivery
  jackson:
    time-zone: Asia/Shanghai

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
      tracking-modes: cookie

management:
  endpoints:
    web:
      base-path: /api/v1/system
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
